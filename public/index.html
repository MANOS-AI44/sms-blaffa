<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>SMS BLAFFA</title>
<link rel="manifest" href="/sms-center-manifest.json" />
<link rel="icon" href="/sms-center-192.png" />
<link rel="apple-touch-icon" href="/sms-center-192.png" />
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#152139; --line:#22314f;
    --txt:#e8eefc; --muted:#94a6c7; --muted2:#6b7ea3;
    --accent:#3b82f6; --accent2:#1d4ed8;
    --green:#16a34a; --greenbg:#0f2a1c; --greenln:#1f5136;
    --amber:#d97706; --amberbg:#2a2010; --amberln:#5a4318;
    --red:#dc2626; --redbg:#2a1417; --redln:#5a2530;
    --purple:#a855f7; --purplebg:#221333; --purpleln:#4a2b6b;
    --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}

  /* ---------- LOGIN ---------- */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card-login{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);text-align:center;
  }
  .brand{font-size:26px;font-weight:800;letter-spacing:.5px}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 22px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input{
    width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:18px;letter-spacing:2px;text-align:center;
    text-transform:uppercase;font-weight:700;
  }
  .field input.small{font-size:13px;letter-spacing:0;text-transform:none;text-align:left;font-weight:400}
  .btn-primary{
    width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:16px;font-weight:700;margin-top:6px;
  }
  .btn-primary:disabled{opacity:.5}
  .err{color:#fca5a5;font-size:13px;margin-top:12px;min-height:16px}
  .advToggle{background:none;border:none;color:var(--muted);font-size:12px;margin-top:14px;text-decoration:underline}

  /* ---------- APP SHELL ---------- */
  #app{display:none;max-width:820px;margin:0 auto}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-top));
    padding-top:max(10px,env(safe-area-inset-top));
  }
  .topbar-row{display:flex;align-items:center;gap:10px}
  .topbar .brand{font-size:18px}
  .org{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.2;max-width:45%;overflow:hidden}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 10px;font-size:13px}
  .search{
    display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:2px 10px;
  }
  .search svg{flex:0 0 auto;opacity:.6}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:16px;padding:12px 0}
  .search .clear{background:none;border:none;color:var(--muted);font-size:20px;padding:0 6px;display:none}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;
  }
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .advanced{padding:0 14px;overflow:hidden;max-height:0;transition:max-height .25s ease}
  .advanced.open{max-height:260px;padding-bottom:6px}
  .adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .adv-grid .full{grid-column:1 / -1}
  .adv-grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .adv-grid select,.adv-grid input{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:14px;
  }
  .adv-actions{display:flex;justify-content:flex-end;margin-top:8px}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600}

  .meta{padding:8px 16px;color:var(--muted2);font-size:12px;display:flex;align-items:center;gap:8px}
  .meta .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}

  #list{padding:4px 12px 40px}

  /* ---------- MESSAGE CARD ---------- */
  .msg{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.2);
    border-left:4px solid var(--line);
  }
  .msg.in{border-left-color:var(--green)}
  .msg.out{border-left-color:var(--amber)}
  .msg.cancel{border-left-color:var(--red)}
  .msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .amount{font-size:19px;font-weight:800}
  .amount.in{color:#4ade80}
  .amount.out{color:#fbbf24}
  .amount.cancel{color:#f87171}
  .op{font-size:13px;color:var(--muted);font-weight:600}
  .pill{margin-left:auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid}
  .pill.SUCCESS{color:#4ade80;background:var(--greenbg);border-color:var(--greenln)}
  .pill.PENDING{color:#fbbf24;background:var(--amberbg);border-color:var(--amberln)}
  .pill.FAILED,.pill.ERROR{color:#f87171;background:var(--redbg);border-color:var(--redln)}
  .pill.NEUTRAL{color:var(--muted);background:var(--panel2);border-color:var(--line)}
  .msg-sub{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .msg-sub b{color:var(--txt);font-weight:600}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .body{
    margin-top:10px;font-size:13px;line-height:1.45;color:#c7d3ea;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;white-space:pre-wrap;word-break:break-word;
  }
  .time{font-size:11.5px;color:var(--muted2);margin-top:8px}

  /* ---------- CANCELLATION PAIR ---------- */
  .pair{
    margin:16px 0;border:1.5px dashed var(--redln);border-radius:18px;padding:8px 8px 4px;
    background:linear-gradient(180deg,rgba(220,38,38,.06),rgba(0,0,0,0));
  }
  .pair-label{
    display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#f87171;
    padding:2px 8px 6px;text-transform:uppercase;letter-spacing:.4px;
  }
  .pair .msg{margin:6px 4px}
  .pair-link{
    display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;
    padding:2px 12px;
  }
  .pair-link .arrow{color:#f87171;font-size:15px}
  .pair-missing{color:var(--muted2);font-size:12px;padding:6px 12px 8px;font-style:italic}

  /* ---------- STATES ---------- */
  .state{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  .spinner{
    width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .more{
    display:block;width:calc(100% - 24px);margin:8px 12px 30px;padding:14px;border-radius:12px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:14px;font-weight:600;
  }
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#fff;
    padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:50;
    border:1px solid var(--line);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card-login">
    <div class="brand">SMS <span>BLAFFA</span></div>
    <div class="sub">Centre de messages — saisissez votre code d'accès</div>
    <div class="field">
      <label for="code">Code d'accès</label>
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="EX : BLF303" maxlength="32" />
    </div>
    <button class="btn-primary" id="loginBtn">Se connecter</button>
    <div class="err" id="loginErr"></div>
    <button class="advToggle" id="apiToggle">Serveur avancé</button>
    <div class="field" id="apiField" style="display:none;margin-top:12px">
      <label for="apiUrl">URL du serveur (API)</label>
      <input id="apiUrl" class="small" autocomplete="off" spellcheck="false"
             placeholder="https://blaffa-file.onrender.com" />
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">SMS <span>BLAFFA</span></div>
      <div class="org" id="orgName"></div>
      <button class="icon-btn" id="refreshBtn" title="Rafraîchir">&#8635;</button>
      <button class="icon-btn" id="logoutBtn" title="Déconnexion">Quitter</button>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="q" inputmode="search" autocomplete="off"
             placeholder="Rechercher : numéro, montant, texte…" />
      <button class="clear" id="qClear">&times;</button>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-f="">Tous</button>
    <button class="chip" data-f="depot">Dépôts</button>
    <button class="chip" data-f="retrait">Retraits</button>
    <button class="chip" data-f="annulations">Annulations</button>
    <button class="chip" data-f="__adv" id="advChip">Filtres +</button>
  </div>

  <div class="advanced" id="advanced">
    <div class="adv-grid">
      <div>
        <label>Plateforme</label>
        <select id="fPlatform"><option value="">Toutes</option></select>
      </div>
      <div>
        <label>Opérateur</label>
        <select id="fOperator"><option value="">Tous</option></select>
      </div>
      <div>
        <label>Du</label>
        <input type="date" id="fFrom" />
      </div>
      <div>
        <label>Au</label>
        <input type="date" id="fTo" />
      </div>
    </div>
    <div class="adv-actions">
      <button class="link-btn" id="resetAdv">Réinitialiser</button>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- config / state ----------
  var DEFAULT_API = "https://blaffa-file.onrender.com";
  var LS_TOKEN = "smsblaffa_token";
  var LS_API   = "smsblaffa_api";
  var ENDPOINT = "/api/public/sms-app";
  var PAGE = 60;

  var state = {
    code: "",
    api: DEFAULT_API,
    q: "",
    filtre: "",
    platform: "",
    operator: "",
    from: "",
    to: "",
    before: null,
    hasMore: false,
    loading: false,
    items: [],
    seq: 0
  };

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function fmtAmount(n){
    if(n==null||isNaN(n)) return "";
    return Number(n).toLocaleString("fr-FR");
  }
  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso); if(isNaN(d)) return String(iso);
    var now = new Date();
    var sameDay = d.toDateString()===now.toDateString();
    var y = new Date(now); y.setDate(now.getDate()-1);
    var yest = d.toDateString()===y.toDateString();
    var hm = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    if(sameDay) return "Aujourd'hui " + hm;
    if(yest) return "Hier " + hm;
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}) + " " + hm;
  }
  function last4(s){ s=String(s||""); return s.length>4 ? "…"+s.slice(-4) : s; }

  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); },2600);
  }

  function statusClass(s){
    s=String(s||"").toUpperCase();
    if(s.indexOf("SUCC")>-1||s==="OK"||s==="CONFIRMED") return "SUCCESS";
    if(s.indexOf("PEND")>-1||s.indexOf("WAIT")>-1) return "PENDING";
    if(s.indexOf("FAIL")>-1||s.indexOf("ERR")>-1||s.indexOf("REJ")>-1) return "FAILED";
    return "NEUTRAL";
  }
  function statusLabel(s){
    var c=statusClass(s);
    return c==="SUCCESS"?"Réussi":c==="PENDING"?"En attente":c==="FAILED"?"Échec":(s||"—");
  }

  function isCancel(m){
    return m && (m.annulation===true ||
      String(m.transactionType||"").toUpperCase().indexOf("CANCEL")>-1 ||
      String(m.transactionType||"").toUpperCase().indexOf("ANNUL")>-1);
  }
  function isOut(m){ return m && (m.sortant===true || String(m.direction||"").toUpperCase()==="OUTGOING"); }
  function kindClass(m){ return isCancel(m)?"cancel":(isOut(m)?"out":"in"); }

  function typeLabel(m){
    var t=String(m.transactionType||"").toUpperCase();
    if(isCancel(m)) return "Annulation";
    if(t==="DEPOSIT"||t==="DEPOT") return "Dépôt";
    if(t==="PAYOUT"||t==="WITHDRAWAL"||t==="RETRAIT") return "Retrait";
    if(isOut(m)) return "Sortant";
    return t? (t.charAt(0)+t.slice(1).toLowerCase()) : "SMS";
  }

  // ---------- pairing (cancellation <-> original) ----------
  function keysOf(m){
    var ks=[];
    [m.transactionId, m.originalTransferRef].forEach(function(v){
      if(v) ks.push(String(v).trim().toUpperCase());
    });
    return ks;
  }
  function linkKeysOf(cancel){
    var ks=[];
    [cancel.cancellationRef, cancel.originalTransferRef, cancel.transactionId].forEach(function(v){
      if(v) ks.push(String(v).trim().toUpperCase());
    });
    return ks;
  }

  // Build display sequence: cancellations get their original attached beneath them.
  function buildSequence(items){
    // index originals by their keys
    var byKey = {};
    items.forEach(function(m){
      if(isCancel(m)) return;
      keysOf(m).forEach(function(k){ if(!byKey[k]) byKey[k]=m; });
    });
    function findOriginal(cancel){
      var lk = linkKeysOf(cancel);
      for(var i=0;i<lk.length;i++){ if(byKey[lk[i]] && byKey[lk[i]]!==cancel) return byKey[lk[i]]; }
      // fallback: same phone + amount + platform, earlier in time
      var ct = cancel.receivedAt ? new Date(cancel.receivedAt).getTime() : 0;
      var best=null;
      items.forEach(function(m){
        if(m===cancel||isCancel(m)) return;
        if(!cancel.senderPhone||!m.senderPhone) return;
        if(String(m.senderPhone)!==String(cancel.senderPhone)) return;
        if(cancel.amount!=null && m.amount!=null && Number(m.amount)!==Number(cancel.amount)) return;
        if(cancel.platformId && m.platformId && cancel.platformId!==m.platformId) return;
        var mt = m.receivedAt ? new Date(m.receivedAt).getTime() : 0;
        if(ct && mt && mt>ct) return;
        if(!best || mt>(best._t||0)){ best=m; best._t=mt; }
      });
      return best;
    }

    // Pass 1: each cancellation claims its original.
    items.forEach(function(m){
      if(!isCancel(m)) return;
      m._pairOriginal = findOriginal(m) || null;
    });
    // Pass 2: mark originals consumed by a cancellation so they are not shown twice.
    var usedAsOriginal = {};
    items.forEach(function(m){
      if(isCancel(m) && m._pairOriginal) usedAsOriginal[m._pairOriginal.id] = true;
    });
    // Pass 3: emit in original order; cancellations become pairs, consumed originals are skipped.
    var seq = [];
    items.forEach(function(m){
      if(isCancel(m)){
        seq.push({type:"pair", cancel:m, original:m._pairOriginal});
      } else if(usedAsOriginal[m.id]){
        /* shown inside its cancellation pair above — skip standalone */
      } else {
        seq.push({type:"single", msg:m});
      }
    });
    return seq;
  }

  // ---------- rendering ----------
  function renderMsg(m){
    var k = kindClass(m);
    var amt = m.amount!=null ? fmtAmount(m.amount) + " F" : "";
    var sign = k==="in" ? "+" : (k==="out"||k==="cancel" ? "−" : "");
    var head =
      '<div class="msg-head">' +
        (amt ? '<span class="amount '+k+'">'+esc(sign+amt)+'</span>' : '<span class="op">'+esc(typeLabel(m))+'</span>') +
        (amt ? '<span class="op">'+esc(m.operator||"")+'</span>' : '') +
        '<span class="pill '+statusClass(m.status)+'">'+esc(statusLabel(m.status))+'</span>' +
      '</div>';

    var sub = [];
    sub.push('<span class="tag">'+esc(typeLabel(m))+'</span>');
    if(m.platformCode) sub.push('<span class="tag">'+esc(m.platformCode)+'</span>');
    if(m.senderPhone) sub.push('<span>N° <b>'+esc(m.senderPhone)+'</b></span>');
    else if(m.sender) sub.push('<span>De <b>'+esc(m.sender)+'</b></span>');
    if(m.beneficiary) sub.push('<span>Bénéf. <b>'+esc(m.beneficiary)+'</b></span>');
    if(m.transactionId) sub.push('<span>Réf <b>'+esc(last4(m.transactionId))+'</b></span>');
    if(m.balance!=null) sub.push('<span>Solde <b>'+esc(fmtAmount(m.balance))+' F</b></span>');

    var body = m.body ? '<div class="body">'+esc(m.body)+'</div>' : '';
    var time = '<div class="time">'+esc(fmtDate(m.receivedAt))+
               (m.deviceLabel?' · '+esc(m.deviceLabel):'')+'</div>';

    return '<div class="msg '+k+'">'+head+'<div class="msg-sub">'+sub.join("")+'</div>'+body+time+'</div>';
  }

  function renderPair(cancel, original){
    var inner = '<div class="pair-label">⟲ Annulation</div>' + renderMsg(cancel);
    if(original){
      inner += '<div class="pair-link"><span class="arrow">↳</span> Transaction d\'origine</div>' + renderMsg(original);
    } else {
      inner += '<div class="pair-missing">Message d\'origine non trouvé dans les résultats chargés — affinez la recherche par numéro.</div>';
    }
    return '<div class="pair">'+inner+'</div>';
  }

  function render(){
    var list = $("list");
    if(state.loading && state.items.length===0){
      list.innerHTML = '<div class="state"><div class="spinner"></div>Chargement…</div>';
      return;
    }
    if(state.items.length===0){
      list.innerHTML = '<div class="state">Aucun message trouvé.<br>Modifiez la recherche ou les filtres.</div>';
      return;
    }
    var seq = buildSequence(state.items);
    var html = seq.map(function(e){
      return e.type==="pair" ? renderPair(e.cancel, e.original) : renderMsg(e.msg);
    }).join("");
    if(state.hasMore){
      html += '<button class="more" id="moreBtn">Charger plus de messages</button>';
    }
    list.innerHTML = html;
    var mb = $("moreBtn");
    if(mb) mb.onclick = function(){ loadMore(); };
  }

  function renderMeta(){
    var m=$("meta");
    if(state.loading){ m.innerHTML='<span class="dot" style="background:var(--amber)"></span> Recherche en cours…'; return; }
    var n=state.items.length;
    var txt = n===0 ? "" : (n + (state.hasMore?"+ ":" ") + "message"+(n>1?"s":""));
    m.innerHTML = txt ? ('<span class="dot"></span> '+esc(txt)) : "";
  }

  // ---------- API ----------
  function buildUrl(){
    var u = new URL(state.api.replace(/\/+$/,"") + ENDPOINT);
    if(state.q) u.searchParams.set("q", state.q);
    if(state.filtre) u.searchParams.set("filtre", state.filtre);
    if(state.platform) u.searchParams.set("platform", state.platform);
    if(state.operator) u.searchParams.set("operator", state.operator);
    if(state.from) u.searchParams.set("from", state.from);
    if(state.to) u.searchParams.set("to", state.to);
    u.searchParams.set("limit", String(PAGE));
    if(state.before) u.searchParams.set("avant", state.before);
    return u.toString();
  }

  function apiFetch(){
    return fetch(buildUrl(), {
      cache:"no-store",
      headers:{ "Authorization":"Bearer "+state.code, "Accept":"application/json" }
    });
  }

  function fillFilters(data){
    if(data.platforms && data.platforms.length){
      var sel=$("fPlatform"), cur=state.platform;
      sel.innerHTML='<option value="">Toutes</option>' + data.platforms.map(function(p){
        return '<option value="'+esc(p.code)+'">'+esc(p.name||p.code)+'</option>';
      }).join("");
      sel.value=cur;
    }
    if(data.operators && data.operators.length){
      var so=$("fOperator"), co=state.operator;
      so.innerHTML='<option value="">Tous</option>' + data.operators.map(function(o){
        return '<option value="'+esc(o)+'">'+esc(o)+'</option>';
      }).join("");
      so.value=co;
    }
    if(data.org){
      $("orgName").textContent = (data.org.name||data.org.code||"") ;
    }
  }

  function search(reset){
    var mySeq = ++state.seq;
    if(reset){ state.before=null; state.items=[]; }
    state.loading=true; renderMeta(); if(reset) render();
    apiFetch().then(function(r){
      if(r.status===401||r.status===403){ throw {auth:true}; }
      if(!r.ok) throw {msg:"Erreur serveur ("+r.status+")"};
      return r.json();
    }).then(function(data){
      if(mySeq!==state.seq) return; // stale
      state.loading=false;
      state.hasMore = !!data.hasMore;
      state.before = data.nextBefore || null;
      var arr = data.sms||[];
      state.items = state.items.concat(arr);
      fillFilters(data);
      render(); renderMeta();
    }).catch(function(e){
      if(mySeq!==state.seq) return;
      state.loading=false;
      if(e&&e.auth){ toast("Code refusé ou expiré."); logout(); return; }
      $("list").innerHTML='<div class="state">Impossible de charger les messages.<br>'+
        esc((e&&e.msg)||"Vérifiez votre connexion.")+'</div>';
      renderMeta();
    });
  }

  function loadMore(){
    if(state.loading||!state.hasMore) return;
    var mb=$("moreBtn"); if(mb){ mb.textContent="Chargement…"; mb.disabled=true; }
    search(false);
  }

  // ---------- events ----------
  var qTimer=null;
  function onSearchInput(){
    var v=$("q").value.trim();
    $("qClear").style.display = v?"block":"none";
    clearTimeout(qTimer);
    qTimer=setTimeout(function(){ state.q=v; search(true); }, 320);
  }

  function setFiltre(f){
    if(f==="__adv"){ toggleAdvanced(); return; }
    state.filtre=f;
    [].forEach.call(document.querySelectorAll("#chips .chip"), function(c){
      if(c.id==="advChip") return;
      c.classList.toggle("active", c.getAttribute("data-f")===f);
    });
    search(true);
  }

  function toggleAdvanced(){
    var a=$("advanced"); a.classList.toggle("open");
    $("advChip").classList.toggle("active", a.classList.contains("open"));
  }

  // ---------- auth ----------
  function showApp(){
    $("login").style.display="none";
    $("app").style.display="block";
  }
  function showLogin(){
    $("app").style.display="none";
    $("login").style.display="flex";
    $("code").value="";
    $("loginErr").textContent="";
  }
  function logout(){
    try{ localStorage.removeItem(LS_TOKEN); }catch(e){}
    state.code=""; state.items=[]; state.before=null;
    showLogin();
  }

  function doLogin(){
    var code = $("code").value.trim().toUpperCase();
    var api  = ($("apiUrl").value.trim()) || DEFAULT_API;
    if(code.length<4){ $("loginErr").textContent="Code trop court."; return; }
    var btn=$("loginBtn"); btn.disabled=true; btn.textContent="Connexion…";
    $("loginErr").textContent="";
    state.code=code; state.api=api;
    // validate by a light request
    var u=new URL(api.replace(/\/+$/,"")+ENDPOINT); u.searchParams.set("limit","1");
    fetch(u.toString(),{cache:"no-store",headers:{"Authorization":"Bearer "+code,"Accept":"application/json"}})
      .then(function(r){
        if(r.status===401||r.status===403){ throw {auth:true}; }
        if(!r.ok) throw {msg:"Serveur indisponible ("+r.status+")"};
        return r.json();
      }).then(function(){
        try{ localStorage.setItem(LS_TOKEN, code); localStorage.setItem(LS_API, api); }catch(e){}
        btn.disabled=false; btn.textContent="Se connecter";
        showApp(); search(true);
      }).catch(function(e){
        btn.disabled=false; btn.textContent="Se connecter";
        state.code="";
        $("loginErr").textContent = (e&&e.auth) ? "Code d'accès invalide." : ((e&&e.msg)||"Connexion impossible.");
      });
  }

  // ---------- wire up ----------
  function init(){
    // login screen
    $("loginBtn").onclick = doLogin;
    $("code").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
    $("apiToggle").onclick = function(){
      var f=$("apiField"); f.style.display = f.style.display==="none"?"block":"none";
    };

    // app screen
    $("q").addEventListener("input", onSearchInput);
    $("qClear").onclick = function(){ $("q").value=""; $("qClear").style.display="none"; state.q=""; search(true); };
    [].forEach.call(document.querySelectorAll("#chips .chip"), function(c){
      c.onclick = function(){ setFiltre(c.getAttribute("data-f")); };
    });
    $("fPlatform").onchange = function(){ state.platform=this.value; search(true); };
    $("fOperator").onchange = function(){ state.operator=this.value; search(true); };
    $("fFrom").onchange = function(){ state.from=this.value; search(true); };
    $("fTo").onchange = function(){ state.to=this.value; search(true); };
    $("resetAdv").onclick = function(){
      state.platform=state.operator=state.from=state.to="";
      $("fPlatform").value=""; $("fOperator").value=""; $("fFrom").value=""; $("fTo").value="";
      search(true);
    };
    $("refreshBtn").onclick = function(){ search(true); toast("Actualisé"); };
    $("logoutBtn").onclick = logout;

    // restore session
    var saved="", savedApi="";
    try{ saved=localStorage.getItem(LS_TOKEN)||""; savedApi=localStorage.getItem(LS_API)||""; }catch(e){}
    if(savedApi){ state.api=savedApi; $("apiUrl").value=savedApi; }
    if(saved){
      state.code=saved; showApp(); search(true);
    } else {
      showLogin();
    }

    // PWA service worker (network-first version handles updates)
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("/sms-center-sw.js").catch(function(){});
    }
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
